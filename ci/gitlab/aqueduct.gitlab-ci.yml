# GitLab CI template: aqueduct plan + apply stages.
#
# Include this template in your .gitlab-ci.yml:
#
#   include:
#     - project: 'trickle-labs/pg-aqueduct'
#       ref: v0.4.0
#       file: 'ci/gitlab/aqueduct.gitlab-ci.yml'
#
# Then override the variables in your project's .gitlab-ci.yml as needed:
#
#   variables:
#     AQUEDUCT_VERSION: "0.4.0"
#     AQUEDUCT_TARGET: "prod"
#     AQUEDUCT_PROJECT_DIR: "."
#
# The DSN is expected in the CI/CD variable AQUEDUCT_DSN (masked).
# Configure it under Settings → CI/CD → Variables.

variables:
  AQUEDUCT_VERSION: "0.4.0"
  AQUEDUCT_TARGET: "prod"
  AQUEDUCT_PROJECT_DIR: "."
  # Set AQUEDUCT_FAIL_IF_CHANGED to "true" to block MR merges with pending migrations.
  AQUEDUCT_FAIL_IF_CHANGED: "false"
  # Set AQUEDUCT_SUPPRESS_NO_OP to "true" to silence no-op plan comments.
  AQUEDUCT_SUPPRESS_NO_OP: "true"

# ── Helper: install the aqueduct binary ──────────────────────────────────────

.aqueduct_install: &aqueduct_install |
  set -euo pipefail
  OS="linux"
  ARCH="$(uname -m)"
  case "$ARCH" in
    x86_64)  ARCH="x86_64" ;;
    aarch64) ARCH="aarch64" ;;
    *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
  esac
  BINARY="aqueduct-${OS}-${ARCH}"
  DOWNLOAD_URL="https://github.com/trickle-labs/pg-aqueduct/releases/download/v${AQUEDUCT_VERSION}/${BINARY}"
  curl -fsSL -o /usr/local/bin/aqueduct "$DOWNLOAD_URL"
  chmod +x /usr/local/bin/aqueduct
  aqueduct --version

# ── Plan stage ───────────────────────────────────────────────────────────────

aqueduct:plan:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - *aqueduct_install
  script:
    - |
      set -euo pipefail
      EXTRA=""
      if [ "${AQUEDUCT_FAIL_IF_CHANGED}" = "true" ]; then
        EXTRA="$EXTRA --fail-if-changed"
      fi

      DSN_FLAG=""
      if [ -n "${AQUEDUCT_DSN:-}" ]; then
        DSN_FLAG="--dsn ${AQUEDUCT_DSN}"
      fi

      PLAN_OUTPUT="$(aqueduct plan \
        --format markdown \
        --to "${AQUEDUCT_TARGET}" \
        --project-dir "${AQUEDUCT_PROJECT_DIR}" \
        $DSN_FLAG \
        $EXTRA 2>&1)"

      echo "$PLAN_OUTPUT"

      # Post plan as a merge request note (requires $GITLAB_TOKEN with api scope).
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "${GITLAB_TOKEN:-}" ]; then
        if echo "$PLAN_OUTPUT" | grep -q "No changes" && [ "${AQUEDUCT_SUPPRESS_NO_OP}" = "true" ]; then
          echo "Plan is empty, suppressing MR comment."
        else
          MARKER="<!-- aqueduct-plan-comment -->"
          BODY="${MARKER}\n## aqueduct plan — \`${AQUEDUCT_TARGET}\`\n\n\`\`\`\n${PLAN_OUTPUT}\n\`\`\`\n\n_Generated by pg-aqueduct on commit \`${CI_COMMIT_SHA}\`_"

          # Find existing note.
          NOTE_ID="$(curl -fsSL \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
            | python3 -c "
import sys, json
notes = json.load(sys.stdin)
for n in notes:
    if '${MARKER}' in n.get('body', ''):
        print(n['id'])
        break
" 2>/dev/null || echo '')"

          if [ -n "$NOTE_ID" ]; then
            curl -fsSL --request PUT \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"body\": \"${BODY}\"}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${NOTE_ID}"
          else
            curl -fsSL --request POST \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"body\": \"${BODY}\"}" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
          fi
        fi
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - migrations/**/*
        - aqueduct.toml

# ── Apply stage ──────────────────────────────────────────────────────────────

aqueduct:apply:
  stage: deploy
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - *aqueduct_install
  script:
    - |
      set -euo pipefail
      DSN_FLAG=""
      if [ -n "${AQUEDUCT_DSN:-}" ]; then
        echo "Using AQUEDUCT_DSN from CI variables."
        DSN_FLAG="--dsn ${AQUEDUCT_DSN}"
      fi

      aqueduct apply \
        --to "${AQUEDUCT_TARGET}" \
        --project-dir "${AQUEDUCT_PROJECT_DIR}" \
        --resume \
        --log-format json \
        $DSN_FLAG
  environment:
    name: $AQUEDUCT_TARGET
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - migrations/**/*
        - aqueduct.toml
