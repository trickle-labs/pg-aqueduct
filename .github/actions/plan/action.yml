name: aqueduct plan
description: >
  Run `aqueduct plan` and post the migration plan as a pull request comment.
  Creates a new comment or updates an existing one (idempotent via HTML marker).

inputs:
  version:
    description: 'aqueduct CLI version to install (e.g. "0.4.0" or "latest")'
    required: false
    default: 'latest'

  checksum:
    description: 'Expected SHA-256 checksum of the downloaded binary (optional; recommended for pinned versions)'
    required: false
    default: ''

  target:
    description: 'Target name from aqueduct.toml (--to flag)'
    required: true

  project-dir:
    description: 'Path to the aqueduct project directory'
    required: false
    default: '.'

  format:
    description: 'Output format posted to the PR comment: markdown (default) or text'
    required: false
    default: 'markdown'

  fail-on-drift:
    description: 'Exit non-zero if drift is detected'
    required: false
    default: 'false'

  fail-if-changed:
    description: 'Exit non-zero if the plan is non-empty (blocks merges with pending migrations)'
    required: false
    default: 'false'

  suppress-no-op:
    description: 'Do not post a PR comment when the plan is a no-op (empty)'
    required: false
    default: 'false'

  github-token:
    description: 'GitHub token used to post the PR comment (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}

  dsn-secret:
    description: >
      The PostgreSQL DSN value (pass via your secret, e.g. secrets.MY_DSN). Injected as
      AQUEDUCT_DSN environment variable. Composite actions cannot look up secrets
      by name, so pass the secret value directly. If empty, AQUEDUCT_DSN must
      already be set in the calling workflow's environment.
    required: false
    default: ''

  local-archive:
    description: >
      Path to a locally-packaged aqueduct archive (CI-2 / v0.14).
      When set, the composite action uses this archive instead of downloading
      from GitHub releases. Intended for smoke tests that build from source.
    required: false
    default: ''

  allow-plaintext-password:
    description: 'Pass --allow-plaintext-password to aqueduct (only for dev/smoke environments)'
    required: false
    default: 'false'

outputs:
  plan:
    description: 'The full plan output (markdown)'
    value: ${{ steps.run-plan.outputs.plan }}

  is-empty:
    description: '"true" if the plan is a no-op (no changes)'
    value: ${{ steps.run-plan.outputs.is_empty }}

runs:
  using: composite
  steps:
    - name: Install aqueduct
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        # CI-1 (v0.14): Use the same platform-to-suffix mapping as release.yml
        # to ensure downloaded archive names match what was published.
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        MACHINE="$(uname -m)"
        case "${OS}-${MACHINE}" in
          linux-x86_64)    PLATFORM="linux-amd64" ;;
          linux-aarch64)   PLATFORM="linux-arm64" ;;
          darwin-arm64)    PLATFORM="macos-arm64" ;;
          darwin-x86_64)   PLATFORM="macos-amd64" ;;
          mingw*-x86_64|msys*-x86_64|cygwin*-x86_64) PLATFORM="windows-amd64" ;;
          *)
            echo "Unsupported platform: ${OS}-${MACHINE}" >&2
            exit 1
            ;;
        esac

        if [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -fsSL https://api.github.com/repos/trickle-labs/pg-aqueduct/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')"
        fi

        BINARY_NAME="aqueduct-${VERSION}-${PLATFORM}"
        DOWNLOAD_URL="https://github.com/trickle-labs/pg-aqueduct/releases/download/v${VERSION}/${BINARY_NAME}.tar.gz"
        INSTALL_DIR="${RUNNER_TOOL_CACHE:-$HOME/.local/bin}"
        mkdir -p "$INSTALL_DIR"

        echo "Downloading aqueduct v${VERSION} for ${PLATFORM}..."
        TMP_DIR="$(mktemp -d)"

        # CI-2 (v0.14): use local-archive if provided (for smoke tests).
        if [ -n "${{ inputs.local-archive }}" ]; then
          echo "Using local archive: ${{ inputs.local-archive }}"
          cp "${{ inputs.local-archive }}" "${TMP_DIR}/${BINARY_NAME}.tar.gz"
        else
          curl -fsSL -o "${TMP_DIR}/${BINARY_NAME}.tar.gz" "$DOWNLOAD_URL"
        fi

        # Verify checksum if provided.
        if [ -n "${{ inputs.checksum }}" ]; then
          echo "${{ inputs.checksum }}  ${TMP_DIR}/${BINARY_NAME}.tar.gz" | sha256sum --check
        fi

        tar -xzf "${TMP_DIR}/${BINARY_NAME}.tar.gz" -C "${TMP_DIR}"
        cp "${TMP_DIR}/${BINARY_NAME}/aqueduct" "${INSTALL_DIR}/aqueduct"
        chmod +x "${INSTALL_DIR}/aqueduct"

        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
        echo "Installed aqueduct $(${INSTALL_DIR}/aqueduct --version)"

    - name: Run aqueduct plan
      id: run-plan
      shell: bash
      env:
        AQUEDUCT_DSN: ${{ inputs.dsn-secret }}
      run: |
        set -euo pipefail
        EXTRA_FLAGS=""
        if [ "${{ inputs.fail-on-drift }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --fail-on-drift"
        fi
        if [ "${{ inputs.fail-if-changed }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --fail-if-changed"
        fi
        if [ "${{ inputs.allow-plaintext-password }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --allow-plaintext-password"
        fi

        DSN_FLAG=""
        if [ -n "${AQUEDUCT_DSN:-}" ]; then
          # Mask the DSN so it is never printed in CI logs.
          echo "::add-mask::${AQUEDUCT_DSN}"
          DSN_FLAG="--dsn ${AQUEDUCT_DSN}"
        fi

        PLAN_OUTPUT="$(aqueduct plan \
          --format "${{ inputs.format }}" \
          --to "${{ inputs.target }}" \
          --project-dir "${{ inputs.project-dir }}" \
          $DSN_FLAG \
          $EXTRA_FLAGS 2>&1)" || EXIT_CODE=$?

        echo "plan<<EOF" >> "$GITHUB_OUTPUT"
        echo "$PLAN_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        # U-02: After fixing plan exit semantics, exit 0 means either empty plan or
        # non-empty plan without --fail-if-changed/--fail-on-drift.
        # Detect is_empty by checking for "No changes detected" in the plan output.
        if echo "$PLAN_OUTPUT" | grep -q "No changes detected"; then
          echo "is_empty=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_empty=false" >> "$GITHUB_OUTPUT"
        fi

        # Exit 0 regardless of whether the plan is empty or non-empty — the
        # fail-if-changed / fail-on-drift flags control whether the step fails.
        # Exit code 2 (error) is propagated; exit code 1 (non-empty plan with flag) is
        # surfaced only when fail-if-changed=true or fail-on-drift=true.
        if [ "${EXIT_CODE:-0}" = "2" ]; then
          exit 2
        fi
        if [ "${EXIT_CODE:-0}" = "1" ]; then
          exit 1
        fi
        exit 0

    - name: Post plan comment to PR
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        PLAN="${{ steps.run-plan.outputs.plan }}"
        IS_EMPTY="${{ steps.run-plan.outputs.is_empty }}"

        if [ "$IS_EMPTY" = "true" ] && [ "${{ inputs.suppress-no-op }}" = "true" ]; then
          echo "Plan is empty and suppress-no-op is set. Skipping PR comment."
          exit 0
        fi

        MARKER="<!-- aqueduct-plan-comment -->"
        BODY="${MARKER}
        ## aqueduct plan — \`${{ inputs.target }}\`

        \`\`\`
        ${PLAN}
        \`\`\`

        _Generated by [pg-aqueduct](https://github.com/trickle-labs/pg-aqueduct) on commit \`${{ github.sha }}\`_"

        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"

        # Find existing comment.
        COMMENT_ID="$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
          | head -1)"

        if [ -n "$COMMENT_ID" ]; then
          gh api --method PATCH \
            "repos/${REPO}/issues/comments/${COMMENT_ID}" \
            -f body="$BODY"
          echo "Updated existing plan comment (id: ${COMMENT_ID})."
        else
          gh api --method POST \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY"
          echo "Created new plan comment."
        fi
