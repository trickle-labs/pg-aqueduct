name: aqueduct apply
description: >
  Run `aqueduct apply` in CI with resume support, secret masking, and OIDC-based
  secret injection for AWS, GCP, and Azure.

inputs:
  version:
    description: 'aqueduct CLI version to install (e.g. "0.4.0" or "latest")'
    required: false
    default: 'latest'

  checksum:
    description: 'Expected SHA-256 checksum of the downloaded binary'
    required: false
    default: ''

  target:
    description: 'Target name from aqueduct.toml (--to flag)'
    required: true

  project-dir:
    description: 'Path to the aqueduct project directory'
    required: false
    default: '.'

  resume:
    description: 'Pass --resume to skip already-completed steps after an interrupted run'
    required: false
    default: 'false'

  dry-run:
    description: 'Pass --dry-run to show what would be done without executing'
    required: false
    default: 'false'

  strategy:
    description: >
      Migration strategy. Currently only "default" is supported.
      "blue-green" is planned for v0.13 and is accepted but treated as a no-op.
    required: false
    default: 'default'

  dsn-secret:
    description: >
      The PostgreSQL DSN value (pass via your secret, e.g. secrets.MY_DSN). Injected as
      AQUEDUCT_DSN environment variable. Composite actions cannot look up secrets
      by name, so pass the secret value directly. If empty, AQUEDUCT_DSN must
      already be set in the calling workflow's environment.
    required: false
    default: ''

  local-archive:
    description: >
      Path to a locally-packaged aqueduct archive (CI-2 / v0.14).
      When set, the composite action uses this archive instead of downloading
      from GitHub releases. Intended for smoke tests that build from source.
    required: false
    default: ''

  allow-plaintext-password:
    description: 'Pass --allow-plaintext-password to aqueduct (only for dev/smoke environments)'
    required: false
    default: 'false'

  aws-role-arn:
    description: 'AWS IAM role ARN for OIDC-based credential injection'
    required: false
    default: ''

  gcp-workload-identity-provider:
    description: 'GCP Workload Identity Provider for OIDC-based credential injection'
    required: false
    default: ''

  gcp-service-account:
    description: 'GCP service account email for OIDC-based credential injection'
    required: false
    default: ''

outputs:
  migration-id:
    description: 'The migration ID recorded in aqueduct.migrations'
    value: ${{ steps.run-apply.outputs.migration_id }}

  from-version:
    description: 'The DAG version before the migration'
    value: ${{ steps.run-apply.outputs.from_version }}

  to-version:
    description: 'The DAG version after the migration'
    value: ${{ steps.run-apply.outputs.to_version }}

runs:
  using: composite
  steps:
    - name: Install aqueduct
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        # CI-1 (v0.14): Use the same platform-to-suffix mapping as release.yml
        # to ensure downloaded archive names match what was published.
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        MACHINE="$(uname -m)"
        case "${OS}-${MACHINE}" in
          linux-x86_64)    PLATFORM="linux-amd64" ;;
          linux-aarch64)   PLATFORM="linux-arm64" ;;
          darwin-arm64)    PLATFORM="macos-arm64" ;;
          darwin-x86_64)   PLATFORM="macos-amd64" ;;
          mingw*-x86_64|msys*-x86_64|cygwin*-x86_64) PLATFORM="windows-amd64" ;;
          *)
            echo "Unsupported platform: ${OS}-${MACHINE}" >&2
            exit 1
            ;;
        esac

        if [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -fsSL https://api.github.com/repos/trickle-labs/pg-aqueduct/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')"
        fi

        BINARY_NAME="aqueduct-${VERSION}-${PLATFORM}"
        DOWNLOAD_URL="https://github.com/trickle-labs/pg-aqueduct/releases/download/v${VERSION}/${BINARY_NAME}.tar.gz"
        INSTALL_DIR="${RUNNER_TOOL_CACHE:-$HOME/.local/bin}"
        mkdir -p "$INSTALL_DIR"

        echo "Downloading aqueduct v${VERSION} for ${PLATFORM}..."
        TMP_DIR="$(mktemp -d)"

        # CI-2 (v0.14): use local-archive if provided (for smoke tests).
        if [ -n "${{ inputs.local-archive }}" ]; then
          echo "Using local archive: ${{ inputs.local-archive }}"
          cp "${{ inputs.local-archive }}" "${TMP_DIR}/${BINARY_NAME}.tar.gz"
        else
          curl -fsSL -o "${TMP_DIR}/${BINARY_NAME}.tar.gz" "$DOWNLOAD_URL"
        fi

        if [ -n "${{ inputs.checksum }}" ]; then
          echo "${{ inputs.checksum }}  ${TMP_DIR}/${BINARY_NAME}.tar.gz" | sha256sum --check
        fi

        tar -xzf "${TMP_DIR}/${BINARY_NAME}.tar.gz" -C "${TMP_DIR}"
        cp "${TMP_DIR}/${BINARY_NAME}/aqueduct" "${INSTALL_DIR}/aqueduct"
        chmod +x "${INSTALL_DIR}/aqueduct"

        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

    - name: Configure AWS credentials (OIDC)
      if: inputs.aws-role-arn != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: us-east-1

    - name: Configure GCP credentials (OIDC)
      if: inputs.gcp-workload-identity-provider != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
        service_account: ${{ inputs.gcp-service-account }}

    - name: Run aqueduct apply
      id: run-apply
      shell: bash
      env:
        AQUEDUCT_DSN: ${{ inputs.dsn-secret }}
      run: |
        set -euo pipefail

        EXTRA_FLAGS=""
        if [ "${{ inputs.resume }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --resume"
        fi
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
        fi
        if [ "${{ inputs.allow-plaintext-password }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --allow-plaintext-password"
        fi
        # D-04: blue-green strategy is planned (v0.13) — accepted but no-op until then.
        # if [ "${{ inputs.strategy }}" = "blue-green" ]; then
        #   EXTRA_FLAGS="$EXTRA_FLAGS --strategy blue-green"
        # fi

        DSN_FLAG=""
        if [ -n "${AQUEDUCT_DSN:-}" ]; then
          # Mask the DSN so it is never printed in logs.
          echo "::add-mask::${AQUEDUCT_DSN}"
          DSN_FLAG="--dsn ${AQUEDUCT_DSN}"
        fi

        aqueduct apply \
          --to "${{ inputs.target }}" \
          --project-dir "${{ inputs.project-dir }}" \
          --log-format json \
          --yes \
          $DSN_FLAG \
          $EXTRA_FLAGS 2>/tmp/aqueduct-apply-stderr.json

        # Extract migration metadata from the structured apply_complete JSON event
        # emitted on stderr by `aqueduct apply` (U-05: dag_version is separate from migration_id).
        if [ -f /tmp/aqueduct-apply-stderr.json ]; then
          APPLY_COMPLETE_LINE="$(grep '"event":"apply_complete"' /tmp/aqueduct-apply-stderr.json | tail -1 || true)"
          if [ -n "$APPLY_COMPLETE_LINE" ]; then
            MIG_ID="$(echo "$APPLY_COMPLETE_LINE" | python3 -c \
              "import sys, json; d=json.loads(sys.stdin.read()); print(d.get('migration_id',''))" 2>/dev/null || echo '')"
            FROM_VER="$(echo "$APPLY_COMPLETE_LINE" | python3 -c \
              "import sys, json; d=json.loads(sys.stdin.read()); print(d.get('from_version') or '')" 2>/dev/null || echo '')"
            TO_VER="$(echo "$APPLY_COMPLETE_LINE" | python3 -c \
              "import sys, json; d=json.loads(sys.stdin.read()); print(d.get('dag_version',''))" 2>/dev/null || echo '')"
            echo "migration_id=${MIG_ID}" >> "$GITHUB_OUTPUT"
            echo "from_version=${FROM_VER}" >> "$GITHUB_OUTPUT"
            echo "to_version=${TO_VER}" >> "$GITHUB_OUTPUT"
          fi
        fi
