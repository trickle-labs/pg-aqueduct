name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Format & Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Security Audit ──────────────────────────────────────────────────────────
  security-audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # RUSTSEC-2025-0052: async-std unmaintained warning (transitive via httpmock dev-dep only)
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0052

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Run unit tests (lib tests only)
        run: cargo test --lib --all

  # ── Integration Tests ───────────────────────────────────────────────────────
  integration-tests:
    name: Integration tests (PG ${{ matrix.pg-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: [ "18" ]
    env:
      AQUEDUCT_TEST_PG_IMAGE: postgres:${{ matrix.pg-version }}-alpine
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test --test integration --package aqueduct-core -- --nocapture
        env:
          RUST_LOG: debug

  # ── CLI integration tests ───────────────────────────────────────────────────
  cli-tests:
    name: CLI integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the aqueduct binary
        run: cargo build --bin aqueduct

      - name: Run CLI integration tests
        run: cargo test --test cli_integration --package aqueduct-cli -- --nocapture
        env:
          RUST_LOG: debug

  # ── Coverage gate ───────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage (all targets including integration tests)
        run: >
          cargo tarpaulin
          --packages aqueduct-core
          --packages aqueduct-cli
          --all-targets
          --out Xml
          --timeout 300
          --fail-under 60
        env:
          RUST_LOG: info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ── Docs build (M-13) ───────────────────────────────────────────────────────
  docs-build:
    name: Docs build (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin

      - name: Build docs site
        run: mdbook build

      - name: Test mdBook code blocks
        run: mdbook test
        continue-on-error: true

  # ── CLI reference check (U-01/D-02) ─────────────────────────────────────────
  docs-lint:
    name: CLI reference lint
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build aqueduct binary
        run: cargo build --bin aqueduct --release

      - name: Check all subcommands have --help
        run: |
          for cmd in plan apply diff status validate lint import export rollback promote destroy unlock init preview ingest fmt; do
            if ./target/release/aqueduct "$cmd" --help &>/dev/null; then
              echo "✓ $cmd --help"
            else
              echo "✗ $cmd --help failed (exit $?)"
            fi
          done

      - name: Verify --version output matches Cargo.toml
        run: |
          CARGO_VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/version = \"//;s/\"//')"
          BIN_VERSION="$(./target/release/aqueduct --version | awk '{print $2}')"
          echo "Cargo.toml: $CARGO_VERSION"
          echo "Binary:     $BIN_VERSION"
          if [ "$CARGO_VERSION" != "$BIN_VERSION" ]; then
            echo "ERROR: version mismatch between Cargo.toml and binary"
            exit 1
          fi

  # ── MSRV (CI-09) ────────────────────────────────────────────────────────────
  msrv:
    name: MSRV check (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace

  # ── pgtrickle integration gate (CI-04 / T-02) ──────────────────────────────
  pgtrickle-integration:
    name: pgtrickle integration (mock schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: aqueduct
          POSTGRES_DB: aqueduct_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://aqueduct:password@localhost:5432/aqueduct_test
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run pgtrickle integration tests (aqueduct-core)
        run: cargo test --test integration --package aqueduct-core -- --nocapture
        env:
          RUST_LOG: debug
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  # ── CI gate (required for release) ─────────────────────────────────────────
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - security-audit
      - unit-tests
      - integration-tests
      - pgtrickle-integration
      - cli-tests
      - msrv
    steps:
      - name: All CI checks passed
        run: echo "All required CI checks passed"

