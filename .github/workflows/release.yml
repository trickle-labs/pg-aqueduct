name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Full test suite (same checks as CI) ──────────────────────────────────
  test:
    name: Test (lint + unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --lib --all

      - name: Integration tests
        run: cargo test --test integration --package aqueduct-core -- --nocapture
        env:
          RUST_LOG: debug

      - name: CLI integration tests
        run: cargo test --test cli_integration --package aqueduct-cli -- --nocapture
        env:
          RUST_LOG: debug

  # ── 2. Build release artifacts (all platforms, parallel) ────────────────────
  build-artifacts:
    name: Build (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-amd64
            archive_ext: tar.gz
            binary: aqueduct
          - os: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
            archive_ext: tar.gz
            binary: aqueduct
          - os: macos-15
            artifact_suffix: macos-arm64
            archive_ext: tar.gz
            binary: aqueduct
          - os: windows-2022
            artifact_suffix: windows-amd64
            archive_ext: zip
            binary: aqueduct.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin aqueduct

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="aqueduct-${VERSION}-${{ matrix.artifact_suffix }}"
          mkdir -p "dist/${ARCHIVE_NAME}"

          cp "target/release/${{ matrix.binary }}" "dist/${ARCHIVE_NAME}/"
          cp README.md LICENSE "dist/${ARCHIVE_NAME}/" 2>/dev/null || true

          cd dist
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "Archive: ${ARCHIVE_NAME}.tar.gz ($(du -h "${ARCHIVE_NAME}.tar.gz" | cut -f1))"

      - name: Create archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $archiveName = "aqueduct-${version}-${{ matrix.artifact_suffix }}"
          New-Item -ItemType Directory -Path "dist\${archiveName}" -Force | Out-Null

          Copy-Item "target\release\${{ matrix.binary }}" "dist\${archiveName}\"
          Copy-Item README.md, LICENSE "dist\${archiveName}\" -ErrorAction SilentlyContinue

          Compress-Archive -Path "dist\${archiveName}" -DestinationPath "dist\${archiveName}.zip"
          Write-Host "Archive: ${archiveName}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: dist/*.${{ matrix.archive_ext }}
          retention-days: 30
          if-no-files-found: error

  # ── 3. Create GitHub release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-artifacts]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry for this version
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 - <<'EOF'
          import re, sys

          with open("CHANGELOG.md") as f:
              text = f.read()

          version = "${{ steps.version.outputs.version }}"
          pattern = rf"(## \[{re.escape(version)}\][^\n]*\n)(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          if not m:
              print(f"ERROR: No changelog entry found for version {version}", file=sys.stderr)
              sys.exit(1)

          body = m.group(2).strip()
          with open("/tmp/release_notes.md", "w") as out:
              out.write(body + "\n")
          print(f"Extracted {len(body)} chars for v{version}")
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          THEME=$(grep -m1 "^## v${VERSION}" ROADMAP.md \
                  | sed 's/^## v[0-9.]* — //' || echo "")
          if [ -n "$THEME" ]; then
            TITLE="${TAG} — ${THEME}"
          else
            TITLE="${TAG}"
          fi
          gh release create "${TAG}" \
            --title "${TITLE}" \
            --notes-file /tmp/release_notes.md \
            --verify-tag

      - name: Download all platform release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: false

      - name: Attach platform binaries and checksums to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-files
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} release-files/ \;
          if [[ -z "$(ls release-files/ 2>/dev/null)" ]]; then
            echo "WARNING: no binary archives found — skipping binary attachment"
          else
            echo "Attaching binary archives:"
            ls -lh release-files/
            cd release-files
            sha256sum * > SHA256SUMS.txt
            cd ..
            gh release upload "${TAG}" release-files/* --clobber
          fi
