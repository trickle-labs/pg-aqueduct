# Example GitHub Actions workflow: post an aqueduct plan on every PR.
#
# Copy this file to .github/workflows/aqueduct-plan.yml in your repository.
# Adjust the `target` input to match your aqueduct.toml [targets.*] name.

name: aqueduct plan

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'aqueduct.toml'

permissions:
  contents: read
  pull-requests: write   # needed to post PR comments

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run aqueduct plan
        uses: trickle-labs/pg-aqueduct/.github/actions/plan@v0.4.0
        with:
          version: '0.4.0'
          target: prod
          project-dir: .
          format: markdown
          # Set fail-if-changed to true to block merges with pending migrations.
          fail-if-changed: false
          # Suppress the PR comment when there are no changes.
          suppress-no-op: true
          # Pass the name of a GitHub secret containing your DSN.
          dsn-secret: AQUEDUCT_PROD_DSN
